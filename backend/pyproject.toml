[project]
name = "hr-agent-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "openai>=1.50.0",
    "websockets>=13.0",
    "cartesia>=1.0.0",
    # Avatar / Wav2Lip
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "librosa>=0.10.0",
    "scipy>=1.11.0",
    "resampy>=0.4.0",
    "aiortc>=1.9.0",
    "av>=12.0.0",
]

[tool.setuptools.packages.find]
include = ["app", "wav2lip"]

[tool.hatch.build.targets.wheel]
packages = ["app", "wav2lip"]
